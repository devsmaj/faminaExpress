<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - FA-MINNA Express</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="stylesheet" href="assets/css/notifications.css">
    <link rel="stylesheet" href="assets/css/platform.css">
</head>
<body>
    <div id="header"></div>

    <main data-customer-home>
        <section class="form-section"><div class="container"><h2 data-i18n="customer_home.welcome">Welcome back</h2><p id="customer-home-name" data-no-translate></p><div class="customer-home-actions"><a class="btn" href="orders.html" data-i18n="nav.my_orders">My Orders</a><a class="btn" href="delivery-tracking.html" data-i18n="nav.track">Track Order</a><a class="btn" href="profile.html" data-i18n="nav.my_profile">My Profile</a></div></div></section>
        <section class="hero">
            <div class="container">
                <div class="hero-content">
                    <h1 data-i18n="hero.title">Delicious Food Delivered Fast</h1>
                    <p data-i18n="hero.subtitle">Order from your favorite restaurants and get it delivered to your doorstep in minutes.</p>
                    <a href="menu.html" class="cta-button" data-i18n="hero.cta">Order Now</a>
                </div>
            </div>
        </section>

        <section class="categories">
            <div class="container">
                <h2 data-i18n="categories.title">Explore Categories</h2>
                <div class="category-grid" id="categories-grid">
                    <!-- Categories will be populated by JavaScript -->
                </div>
            </div>
        </section>

        <section class="restaurants">
            <div class="container">
                <h2 data-i18n="restaurants.title">Featured Restaurants</h2>
                <div class="restaurant-grid" id="restaurants-grid">
                    <!-- Restaurants will be populated by JavaScript -->
                </div>
            </div>
        </section>
    </main>

    <div id="footer"></div>

    <link rel="stylesheet" href="assets/css/loading.css">
    <script src="assets/js/loading.js"></script>
    <script src="assets/js/notifications.js"></script>
    <script src="assets/js/session.js"></script>
    <script src="assets/locales/catalog.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/frontend-api.js"></script>
    <script src="assets/vendor/supabase.js"></script>
    <script src="assets/js/platform.js"></script>
    <script src="assets/js/cart-state.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/navigation.js"></script>
    <script src="assets/js/cart.js"></script>

    <script src="assets/js/menu.js"></script>
<script src="assets/js/home.js"></script>
<script src="assets/js/customer-home.js"></script>
</body>
</html>
