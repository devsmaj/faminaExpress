<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - FA-MINNA Express</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="stylesheet" href="assets/css/notifications.css">
    <link rel="stylesheet" href="assets/css/platform.css">
<link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
</head>
<body>
    <div id="header"></div>

    <main>
        <section class="checkout-section">
            <div class="container">
                <h2 data-i18n="checkout.title">Checkout</h2>
                <div class="checkout-container">
                    <div class="delivery-form">
                        <h3>Delivery Information</h3>
                        <div id="address-manager"></div>
<form id="checkout-form">
<div class="form-group"><label for="saved-address">Choose a saved address</label><select id="saved-address" required><option value="">Choose a saved address</option></select></div>
<div class="form-group"><label for="payment-method">Payment Method</label><select id="payment-method" name="paymentMethod"><option value="cash_on_delivery">Cash on delivery</option><option value="airtel_money" disabled>Airtel Money � unavailable</option><option value="moov_money" disabled>Moov Money � unavailable</option></select></div>
<button type="button" class="btn-secondary" id="request-quote">Get delivery quote</button>
<div id="checkout-map" class="platform-map"></div>
<button type="submit" class="submit-btn" data-i18n="checkout.place_order" disabled>Place Order</button></form>
                    </div>
                    <div class="order-summary" id="order-summary">
                        <!-- Order summary will be populated by JavaScript -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer"></div>

    <link rel="stylesheet" href="assets/css/loading.css">
    <script src="assets/js/loading.js"></script>
    <script src="assets/js/notifications.js"></script>
    <script src="assets/js/session.js"></script>
    <script src="assets/locales/catalog.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/frontend-api.js"></script>
    <script src="assets/vendor/supabase.js"></script>
    <script src="assets/js/platform.js"></script>
    <script src="assets/js/cart-state.js"></script>
<script src="assets/vendor/leaflet/leaflet.js"></script>
<script src="assets/js/maps.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/navigation.js"></script>
    <script src="assets/js/cart.js"></script>

    <script src="assets/js/checkout.js"></script>
<script src="assets/js/addresses.js"></script>
</body>
</html>
