<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FA-MINNA Express</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
    <div id="header"></div>

    <main>
        <section class="form-section">
            <div class="container">
                <h2 class="smaj">Login to Your Account</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <button type="submit" class="submit-btn">Login</button>
                </form>

                <section id="firebase-auth" class="social-auth" aria-label="Other sign-in methods">
                    <p>Or continue with</p>
                    <button type="button" id="google-continue" class="submit-btn">Continue with Google</button>
                    <button type="button" id="phone-continue" class="submit-btn">Continue with phone number</button>
                    <p id="firebase-status" role="status" aria-live="polite"></p>
                    <form id="phone-form" hidden>
                        <div class="form-group">
                            <label for="auth-phone">Phone number with country code</label>
                            <input id="auth-phone" type="tel" autocomplete="tel" placeholder="+971501234567" required>
                        </div>
                        <p class="sms-notice">By continuing, you agree to receive a verification SMS. Standard message rates may apply. Google processes your number to prevent abuse.</p>
                        <div id="recaptcha-container"></div>
                        <button type="submit" class="submit-btn">Send verification code</button>
                    </form>
                    <form id="phone-code-form" hidden>
                        <div class="form-group">
                            <label for="auth-code">SMS verification code</label>
                            <input id="auth-code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
                        </div>
                        <button type="submit" class="submit-btn">Verify and continue</button>
                        <button type="button" id="resend-code">Resend code</button>
                    </form>
                </section>
                <p class="mt-2">Don't have an account? <a href="register.html">Register here</a></p>
            </div>
        </section>
    </main>

    <div id="footer"></div>

    <script src="assets/js/config.js"></script>
    <script type="module" src="assets/js/firebase-auth.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/frontend-api.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
