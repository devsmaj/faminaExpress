name: FAMIPAY Android APK

on:
  push:
    branches: [main]
    paths:
      - mobile/**
      - assets/**
      - components/**
      - '*.html'
      - .github/workflows/android-preview.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: famipay-android-preview
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      FAMIPAY_MOBILE_PUSH_ENABLED: 'false'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Allocate an increasing Android version
        run: |
          echo "ANDROID_VERSION_CODE=$(($(date +%s) - 1577836800))" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Install mobile dependencies
        run: npm ci --prefix mobile
      - name: Bundle the shared web application and run package tests
        run: |
          npm run sync --prefix mobile
          npm test --prefix mobile
          node --test backend/email-confirmation.test.js backend/supabase-auth-flow.test.js backend/auth-persistence.test.js
      - name: Browser-check the bundled role dashboards and authentication pages
        run: |
          npm ci --prefix backend
          backend/node_modules/.bin/playwright install --with-deps chromium
          BROWSER_CHANNEL=chromium npm run test:browser --prefix mobile
      - name: Install Android build platform and emulator
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "emulator" \
            "system-images;android-36;google_apis;x86_64"
      - name: Restore the original preview update-signing key
        run: |
          gh release download famipay-preview \
            --repo "$GITHUB_REPOSITORY" \
            --pattern preview-signing.keystore \
            --dir "$RUNNER_TEMP"
          echo "FAMIPAY_PREVIEW_KEYSTORE=$RUNNER_TEMP/preview-signing.keystore" >> "$GITHUB_ENV"
      - name: Download the original FAMIPAY-preview-apk archive
        run: |
          gh run download 46068187252 \
            --repo "$GITHUB_REPOSITORY" \
            --name FAMIPAY-preview-apk \
            --dir "$RUNNER_TEMP/original-famipay"
          cp "$RUNNER_TEMP/original-famipay/FAMIPAY-preview.apk" "$RUNNER_TEMP/FAMIPAY-preview.apk"
      - name: Build and verify the original Android application
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/FAMIPAY.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose ../dist/FAMIPAY.apk
          OLD_CERT=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/FAMIPAY-preview.apk" | awk -F': ' '/certificate SHA-256 digest/ {print $2}')
          NEW_CERT=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs ../dist/FAMIPAY.apk | awk -F': ' '/certificate SHA-256 digest/ {print $2}')
          test -n "$OLD_CERT" && test "$OLD_CERT" = "$NEW_CERT"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$RUNNER_TEMP/FAMIPAY-preview.apk" > ../dist/original-apk-info.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging ../dist/FAMIPAY.apk > ../dist/apk-info.txt
          grep -q "name='com.famipay.app.preview'" ../dist/original-apk-info.txt
          grep -q "name='com.famipay.app.preview'" ../dist/apk-info.txt
          OLD_CODE=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" ../dist/original-apk-info.txt | head -n 1)
          NEW_CODE=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" ../dist/apk-info.txt | head -n 1)
          test "$NEW_CODE" -gt "$OLD_CODE"
          python3 ../scripts/check-apk-icons.py "$RUNNER_TEMP/FAMIPAY-preview.apk" ../dist/FAMIPAY.apk > ../dist/original-icon-verification.txt
          cd ../dist && sha256sum FAMIPAY.apk > SHA256SUMS.txt
      - name: Enable emulator hardware acceleration when available
        run: |
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Install existing APK and confirm the update on Android
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb install "$RUNNER_TEMP/FAMIPAY-preview.apk"
            adb install -r mobile/dist/FAMIPAY.apk
            adb shell pm path com.famipay.app.preview
            adb shell dumpsys package com.famipay.app.preview | grep -q "versionCode=${ANDROID_VERSION_CODE}"
            adb logcat -c
            adb shell am start -W -n com.famipay.app.preview/com.famipay.app.MainActivity
            sleep 15
            adb shell pidof com.famipay.app.preview
            adb exec-out screencap -p > mobile/dist/android-update.png
            test -s mobile/dist/android-update.png
            adb logcat -d -b crash > mobile/dist/android-crash-log.txt
            # The emulator may report unrelated system-process crashes.
            # Fail only when the installed FAMIPAY package is implicated.
            if grep -E -q 'Process: com\.famipay\.app\.preview([, :]|$)|>>> com\.famipay\.app\.preview <<<|Cmdline: com\.famipay\.app\.preview$' mobile/dist/android-crash-log.txt; then echo "::error::FAMIPAY crashed after launch; inspect android-crash-log.txt"; exit 1; fi
            cd mobile/android && ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: FAMIPAY-build-backup
          path: mobile/dist/FAMIPAY.apk
          retention-days: 30
      - name: Publish the update APK
        run: |
          cat > "$RUNNER_TEMP/android-notes.md" <<'NOTES'
          Updated FAMIPAY Android app using the existing Capacitor project, launcher icon, package identity and preview signing certificate.

          Packages the website's existing login, registration, email verification, onboarding and role-aware private dashboard. Email confirmation opens the app through the existing `famipay://auth/login` callback. Web page markup and styles are reused; onboarding design is unchanged.

          Package: `com.famipay.app.preview`. This update can install over the existing preview APK. Financial actions remain governed by the existing backend; this build does not fabricate payment results.
          NOTES
          printf '\nVersion: %s (%s)\nCommit: %s\n' "$ANDROID_VERSION_NAME" "$ANDROID_VERSION_CODE" "$GITHUB_SHA" >> "$RUNNER_TEMP/android-notes.md"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/famipay-preview" -f sha="$GITHUB_SHA" -F force=true
          gh release edit famipay-preview --repo "$GITHUB_REPOSITORY" \
            --title "FAMIPAY Android $ANDROID_VERSION_NAME" \
            --notes-file "$RUNNER_TEMP/android-notes.md" --prerelease
          gh release upload famipay-preview --repo "$GITHUB_REPOSITORY" \
            mobile/dist/FAMIPAY.apk mobile/dist/SHA256SUMS.txt mobile/dist/apk-info.txt --clobber
          echo "APK: https://github.com/$GITHUB_REPOSITORY/releases/download/famipay-preview/FAMIPAY.apk" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove superseded debug ZIPs after successful Android update
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "famipay-android-debug") | .id' | \
          while read -r artifact_id; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done
      - name: Save Android update verification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: FAMIPAY-android-update-verification
          path: |
            mobile/dist/android-update.png
            mobile/dist/android-crash-log.txt
            mobile/dist/original-apk-info.txt
            mobile/dist/apk-info.txt
            mobile/dist/original-icon-verification.txt
            mobile/android/app/build/reports/androidTests/
            mobile/android/app/build/reports/tests/
          if-no-files-found: ignore
